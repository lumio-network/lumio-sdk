name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: packages/*/coverage/
          if-no-files-found: error

  pr-metadata:
    name: Validate PR title and changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          scoped_title='^(feat|fix|docs|style|refactor|perf|test|build|revert)\((shared|sdk|ui)\)!?:[[:space:]]+[^[:space:]].*$'
          unscoped_title='^(ci|chore|docs)!?:[[:space:]]+[^[:space:]].*$'
          if [[ "$PR_TITLE" =~ $scoped_title || "$PR_TITLE" =~ $unscoped_title ]]; then
            echo "PR title follows the accepted Conventional Commit format."
          else
            echo "::error::Use type(scope): description with scope shared, sdk, or ui; or use scopeless ci:, chore:, or docs:."
            exit 1
          fi

      - name: Require a changeset for package changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          added_or_modified_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")"
          package_changed=false
          has_changeset=false

          while IFS= read -r path; do
            if [[ "$path" == packages/*/* ]]; then
              package_changed=true
              break
            fi
          done <<< "$changed_files"

          while IFS= read -r path; do
            if [[ "$path" == .changeset/*.md && "$path" != .changeset/README.md ]]; then
              has_changeset=true
              break
            fi
          done <<< "$added_or_modified_files"

          if [[ "$package_changed" == true && "$has_changeset" == false ]]; then
            echo "::error::Changes to packages/** require a .changeset/*.md entry. Add an empty changeset for non-release package changes."
            exit 1
          fi

          echo "Changeset requirement satisfied."
